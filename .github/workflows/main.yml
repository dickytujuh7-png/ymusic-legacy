
name: YMusic Legacy Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q YMusicLegacy_API18_ARMv7_Project.zip -d extracted

      - name: Build Debug APK
        run: |
          gradle --no-daemon \
            -p extracted/YMusicLegacy \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMusicLegacy-API18-ARMv7
          path: extracted/YMusicLegacy/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
