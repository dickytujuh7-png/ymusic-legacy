

name: Build Q10 Video Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Extract Project ZIP
        run: |
          ZIP=$(find . -maxdepth 4 \
            -name "Q10VideoLiteProject_v1_1.zip" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Gradle project tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" \
            >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Q10VideoLite-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
