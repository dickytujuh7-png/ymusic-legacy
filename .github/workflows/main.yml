
name: Build YMusic Legacy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q YMusicLegacy_API18_ARMv7_Project.zip -d project
          find project -maxdepth 3 -type f | head -100

      - name: Check Gradle project
        run: |
          find project -name gradlew -type f
