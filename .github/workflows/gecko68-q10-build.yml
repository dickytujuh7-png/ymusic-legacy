name: Build GeckoView 68 Q10 test APK

on:
  push:
    branches:
      - gecko68-q10-apk
    paths:
      - 'gecko68-q10-test/**'
      - '.github/workflows/gecko68-q10-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '5.6.4'

      - name: Build debug APK
        working-directory: gecko68-q10-test
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gecko68-q10-debug-apk
          path: gecko68-q10-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
