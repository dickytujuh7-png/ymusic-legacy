
name: Build YMusic Legacy APK

on:
  push:
    branches: [utama]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract project ZIP
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 2 -iname '*.zip' -type f | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source

      - name: Build APK
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "File gradlew tidak ditemukan"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YMusic-Legacy-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
