name: Build KaiOS Simulator APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'kaios-simulator/**'
      - '.github/workflows/kaios-simulator.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: kaios-simulator
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KaiOS-Simulator-debug
          path: kaios-simulator/app/build/outputs/apk/debug/app-debug.apk
