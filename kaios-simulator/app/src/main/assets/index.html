<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>KaiOS Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#fff;font:16px Arial,sans-serif;min-height:100vh}.phone{width:100%;max-width:430px;height:100dvh;min-height:560px;margin:auto;background:#101820;display:flex;flex-direction:column;overflow:hidden}.status{height:28px;padding:6px 12px;background:#090f14;font-size:12px;display:flex;justify-content:space-between}.screen{flex:1;position:relative;overflow:auto;background:linear-gradient(160deg,#153d55,#101820 70%);padding:18px}.clock{text-align:center;font-size:48px;font-weight:300;margin:18px 0 4px}.date{text-align:center;color:#c7d8e2;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 12px}.app{border:0;background:transparent;color:white;text-align:center;font-size:12px;padding:5px;cursor:pointer}.ico{width:58px;height:58px;border-radius:17px;margin:0 auto 8px;display:grid;place-items:center;font-size:28px;background:#e8f4fa;color:#123447;box-shadow:0 4px 12px #0005}.bar{height:54px;background:#090f14;display:flex;justify-content:space-around;align-items:center;color:#d9e6ec;font-size:12px}.bar button{background:none;border:0;color:inherit;font-size:12px;padding:10px}.panel{background:#f3f7f9;color:#142b38;border-radius:10px;padding:14px;min-height:100%}.panel h2{margin:0 0 14px;font-size:22px}.item{padding:13px 8px;border-bottom:1px solid #d5e0e5;cursor:pointer}.item:active,.app:active .ico{opacity:.7}.back{background:#123d54;color:white;border:0;border-radius:6px;padding:9px 14px;margin-bottom:12px}.note{font-size:12px;color:#526b78;margin-top:18px}.search{width:100%;padding:12px;border:1px solid #b8c9d1;border-radius:7px;font-size:16px}.hidden{display:none}
</style></head><body><main class="phone"><div class="status"><span>● KaiOS Simulator</span><span>4G ▮▮▮  🔋</span></div><section class="screen" id="screen"><div id="home"><div class="clock" id="clock">12:00</div><div class="date" id="date"></div><div class="grid" id="apps"></div></div><div id="view" class="hidden"></div></section><footer class="bar"><button onclick="goHome()">Home</button><button onclick="openApp('Settings')">Options</button><button onclick="goBack()">Back</button></footer></main>
<script>
const apps=[['Phone','📞'],['Contacts','👤'],['Messages','✉️'],['Browser','🌐'],['Gallery','🖼️'],['Music','🎵'],['Clock','⏰'],['Settings','⚙️'],['KaiStore','🛍️']];
const home=document.getElementById('home'),view=document.getElementById('view');let current='';let contacts=['Tambah kontak baru','Kontak contoh'];let messages=['Tidak ada pesan baru'];let volume=60;
document.getElementById('apps').innerHTML=apps.map(a=>'<button class="app" onclick="openApp(\''+a[0]+'\')"><div class="ico">'+a[1]+'</div>'+a[0]+'</button>').join('');
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});}tick();setInterval(tick,10000);
function goHome(){current='';view.classList.add('hidden');home.classList.remove('hidden')}
function goBack(){goHome()}
function page(title,body){home.classList.add('hidden');view.classList.remove('hidden');view.innerHTML='<div class="panel"><button class="back" onclick="goHome()">← Kembali</button><h2>'+title+'</h2>'+body+'</div>'}
function openApp(name){current=name;const pages={
Phone:'<div class="item">📞 Papan tombol</div><input class="search" placeholder="Masukkan nomor (simulasi)"><p class="note">Panggilan telepon tidak dilakukan oleh simulator.</p>',
Contacts:contacts.map(x=>'<div class="item">'+x+'</div>').join('')+'<button class="back" onclick="addContact()">＋ Tambah kontak</button>',
Messages:messages.map(x=>'<div class="item">'+x+'</div>').join('')+'<p class="note">SMS hanya tampilan demo.</p>',
Browser:'<p>Browser demo menggunakan halaman web eksternal.</p><input id="url" class="search" value="https://www.google.com"><button class="back" onclick="browse()">Buka situs</button><div id="webhint" class="note">Situs akan dibuka di browser perangkat.</div>',
Gallery:'<div class="item">📷 Galeri perangkat belum terhubung</div><p class="note">Ini adalah layar simulasi.</p>',
Music:'<div class="item">🎵 Pemutar musik demo</div><input type="range" min="0" max="100" value="'+volume+'" oninput="volume=this.value"><p class="note">Pemutaran file lokal belum diaktifkan.</p>',
Clock:'<div class="item">Jam: '+new Date().toLocaleTimeString('id-ID')+'</div><div class="item">Alarm (demo)</div>',
Settings:'<div class="item">Jaringan: simulasi</div><div class="item">Suara: '+volume+'%</div><div class="item">Tentang KaiOS Simulator</div><p class="note">Versi 0.1.0 · Antarmuka terinspirasi KaiOS, bukan sistem operasi KaiOS asli.</p>',
KaiStore:'<div class="item">📱 Katalog aplikasi KaiOS</div><p>Untuk melihat katalog web, buka portal komunitas KaiOS melalui browser.</p><button class="back" onclick="location.href=\'https://kaios.app/\'">Buka katalog web</button><p class="note">Katalog tidak menginstal aplikasi KaiOS ke Android.</p>'
};page(name,pages[name]||'Layar demo');}
function addContact(){let n=prompt('Nama kontak:');if(n){contacts.push(n);openApp('Contacts')}}
function browse(){let u=document.getElementById('url').value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u; if(u)location.href=u}
</script></body></html>
